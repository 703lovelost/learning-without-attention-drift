[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eagle3-olmo2"
version = "0.1.0"
description = "OLMo-2 EAGLE-3 training orchestration using SpecForge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
pipeline = [
    "click>=8.0",
    "datasets>=3.0",
    "dvc>=3.50",
    "hydra-core>=1.3",
    "huggingface-hub",
    "mlflow",
    "safetensors",
    "specforge",
]

[project.scripts]
eagle3-olmo2 = "eagle3_olmo2.cli:main"
eagle3-olmo2-dvc-setup = "eagle3_olmo2.dvc:main"
eagle3-olmo2-hydra = "eagle3_olmo2.hydra_cli:main"

[dependency-groups]
dev = [
    "black>=24.0",
    "flake8>=7.0",
    "isort>=5.13",
    "pre-commit>=3.7",
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eagle3_olmo2"]

[tool.uv.sources]
specforge = { path = "specforge", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA and external model/data downloads"]

[tool.isort]
profile = "black"
