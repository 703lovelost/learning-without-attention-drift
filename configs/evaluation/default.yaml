evaluation:
  # Native SpecForge offline evaluation consumes separately captured features.
  eval_interval: 100
  max_eval_samples: 128
  inference_max_new_tokens: 24
  inference_port: 30000
  generation:
    dtype: bfloat16
    seed: 42
    context_length: 4096
    mem_fraction_static: 0.55
    attention_backend: triton
    speculative_steps: 3
    speculative_topk: 1
    speculative_draft_tokens: 4
    request_timeout: 120
    benchmark_warmup: 1
    benchmark_repeats: 3
