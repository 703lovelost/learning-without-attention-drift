training:
  strategy: eagle3
  num_epochs: 1
  max_steps: 1000
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 0.0001
  # SpecForge's built-in BF16Optimizer uses AdamW; the composer validates and
  # removes this project-level selector before native schema validation.
  optimizer: adamw
  lr_scheduler: cosine
  warmup_ratio: 0.01
  max_grad_norm: 0.5
  optimizer_cpu_offload: true
  ttt_length: 8
  # Native EAGLE-3 KL distillation controls; tune through this module.
  kl_scale: 1.0
  kl_decay: 0.8
  attention_backend: sdpa
  save_interval: 100
  eval_interval: 100
  log_interval: 10
  max_checkpoints: 3
  compact_teacher: true
  compact_teacher_chunk_size: 2048
  seed: 42
  dataloader_num_workers: 0
