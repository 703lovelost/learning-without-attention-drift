model:
  target_model_path: allenai/OLMo-2-0425-1B-Instruct
  revision: 48d788eca847d4d7548f375ad03d3c9312f6139e
  tokenizer_path: allenai/OLMo-2-0425-1B-Instruct
  tokenizer_revision: 48d788eca847d4d7548f375ad03d3c9312f6139e
  draft_architecture: LlamaForCausalLMEagle3
  draft_model_config: olmo2_1b_eagle3.json
  trust_remote_code: false
  torch_dtype: bfloat16
  # SGLang handles evaluation capture and generation. Training uses the
  # Transformers OLMo-2 backbone for the frozen forward pass.
  target_backend: sglang
  train_target_cpu_offload: true
  # SpecForge pins SGLang 0.5.18, which rejects FlashInfer for Olmo2 targets.
  capture_attention_backend: triton
  sglang_mem_fraction_static: 0.35
  embedding_key: model.embed_tokens.weight
  lm_head_key: lm_head.weight
  draft_num_hidden_layers: 1
  draft_vocab_size: 32000
  # Zero-based target block indices; OLMo-2 1B has 16 transformer blocks.
  aux_hidden_state_layer_ids: [1, 7, 12]
  max_position_embeddings: 4096
